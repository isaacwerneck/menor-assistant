<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menor - Assistente IA</title>
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #111827;
            --bg-tertiary: #1f2937;
            --bg-hover: #283344;
            --border: #374151;
            --text-primary: #f0f4f8;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --user-bubble: #2563eb;
            --success: #34d399;
            --sidebar-width: 280px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100dvh;
            display: flex;
            overflow: hidden;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s ease;
        }

        .sidebar.hidden {
            margin-left: calc(-1 * var(--sidebar-width));
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }

        .new-chat-btn:hover { background: var(--bg-hover); border-color: var(--accent); }

        .sidebar-conversations {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .sidebar-conversations::-webkit-scrollbar { width: 4px; }
        .sidebar-conversations::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .sidebar-section-title {
            padding: 12px 12px 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .conv-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: 0.15s;
            white-space: nowrap;
            overflow: hidden;
        }

        .conv-item:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .conv-item.active { background: var(--bg-tertiary); color: var(--text-primary); }

        .conv-item button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
        .conv-item .conv-title {
            text-align: left;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-item .conv-delete {
            opacity: 0;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            padding: 0 4px;
            transition: 0.15s;
        }

        .conv-item:hover .conv-delete, .conv-item:focus-within .conv-delete { opacity: 1; }
        button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .conv-item .conv-delete:hover { color: #ef4444; }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .sidebar-footer .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }

        /* ========== MAIN AREA ========== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toggle-sidebar-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: 0.15s;
        }

        .toggle-sidebar-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }

        .topbar-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .topbar-model {
            margin-left: auto;
            font-size: 0.8rem;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            padding: 4px 10px;
            border-radius: 6px;
        }

        /* ========== CHAT AREA ========== */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar { width: 6px; }
        .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
            padding: 40px;
        }

        .welcome-logo { font-size: 3rem; }

        .welcome-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .welcome-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 500px;
            line-height: 1.6;
        }

        .welcome-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
        }

        .suggestion-chip {
            padding: 10px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .suggestion-chip:hover { background: var(--bg-hover); border-color: var(--accent); color: var(--text-primary); }

        .messages-container {
            max-width: 820px;
            margin: 0 auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .message-row {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .message-row.user { flex-direction: row-reverse; }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .avatar.bot-avatar { background: var(--accent); color: var(--bg-primary); }
        .avatar.user-avatar { background: #7c3aed; color: #fff; }

        .message-content {
            flex: 1;
            line-height: 1.7;
            font-size: 0.95rem;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 720px;
        }

        .message-row.user .message-content { text-align: right; }

        @media (prefers-reduced-motion: reduce) {
            *, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
        }

        .message-content.cursor::after {
            content: '▋';
            display: inline;
            animation: blink 1s infinite;
            color: var(--accent);
            margin-left: 2px;
        }

        @keyframes blink { 0%, 50% { opacity: 1; } 50.1%, 100% { opacity: 0; } }

        /* ========== INPUT BAR ========== */
        .input-area {
            padding: 16px 20px 24px;
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            width: 100%;
            max-width: 820px;
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 14px;
            transition: 0.2s;
        }

        .input-wrapper:focus-within { border-color: var(--accent); }

        .input-wrapper textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 24px;
            max-height: 150px;
            line-height: 1.5;
        }

        .send-btn {
            align-self: flex-end;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: var(--bg-primary);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover { background: var(--accent-hover); color: #fff; }
        .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .input-footer {
            text-align: center;
            padding: 0 20px 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .sidebar { position: fixed; z-index: 100; height: 100%; }
            .sidebar.hidden { margin-left: calc(-1 * var(--sidebar-width)); }
            .conv-item .conv-delete { opacity: 1; }
            .welcome-suggestions { flex-direction: column; }
        }
    </style>
</head>
<body>
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="newChat()">
                <span>＋</span>
                <span>Nova Conversa</span>
            </button>
        </div>
        <div class="sidebar-conversations" id="convList">
            <div class="sidebar-section-title">Conversas Recentes</div>
        </div>
        <div class="sidebar-footer">
            <div class="dot"></div>
            <span>Menor v0.2 · IA local</span>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
        <div class="topbar">
            <button class="toggle-sidebar-btn" aria-label="Alternar conversas" onclick="toggleSidebar()">☰</button>
            <div class="topbar-title" id="topbarTitle">Menor</div>
            <button class="toggle-sidebar-btn" onclick="exportChat()" aria-label="Exportar conversa em Markdown">↓</button>
            <div class="topbar-model" id="modelName">qwen2.5-coder:7b</div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-logo">⚡</div>
                <div class="welcome-title">Menor</div>
                <div class="welcome-subtitle">Seu assistente pessoal de IA rodando localmente. Programação, projetos, jogos e o que mais precisar.</div>
                <div class="welcome-suggestions">
                    <button type="button" class="suggestion-chip" onclick="useSuggestion(this)">Me ajude a planejar meu próximo projeto</button>
                    <button type="button" class="suggestion-chip" onclick="useSuggestion(this)">Escreva um código em Python pra...</button>
                    <button type="button" class="suggestion-chip" onclick="useSuggestion(this)">Quais são seus módulos e capacidades?</button>
                    <button type="button" class="suggestion-chip" onclick="useSuggestion(this)">Me explique como funciona uma rede neural</button>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer" style="display:none;"></div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="userInput" rows="1" maxlength="8000" aria-label="Mensagem para o Menor" placeholder="Mande uma mensagem para o Menor..."
                    onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
                <button class="send-btn" id="sendBtn" aria-label="Enviar mensagem" onclick="sendMsg()">➤</button>
            </div>
        </div>
        <div class="input-footer" id="storageStatus" role="alert" hidden></div>
        <div class="input-footer" id="connectionStatus" role="status">Verificando conexão com Ollama...</div>
    </div>

    <script>
        // ========== STATE ==========
        let canSave = true;
        let conversations = loadConversations();
        let activeConvId = null;
        let isGenerating = false;

        // ========== INIT ==========
        renderConvList();
        showWelcome();
        refreshHealth();
        setInterval(refreshHealth, 30000);

        // ========== CONVERSATIONS ==========
        function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

        function loadConversations() {
            try {
                const saved = JSON.parse(localStorage.getItem('menor_convs') || '[]');
                if (!Array.isArray(saved) || saved.some(c =>
                    !c || typeof c.id !== 'string' || !/^[a-z0-9]+$/.test(c.id) ||
                    typeof c.title !== 'string' || !Array.isArray(c.messages) ||
                    c.messages.some(m => !m || !['user', 'bot'].includes(m.role) ||
                        typeof m.content !== 'string'))) {
                    throw new Error('Formato de conversas inválido.');
                }
                return saved;
            } catch (error) {
                canSave = false;
                const status = document.getElementById('storageStatus');
                status.hidden = false;
                status.textContent = 'Conversas salvas não puderam ser carregadas e foram preservadas. ' +
                    'Novas conversas só ficam na memória; exporte-as. ' + error.message;
                return [];
            }
        }

        function save() {
            if (!canSave) return;
            try {
                localStorage.setItem('menor_convs', JSON.stringify(conversations));
            } catch (error) {
                const status = document.getElementById('storageStatus');
                status.hidden = false;
                status.textContent = 'Não foi possível salvar no navegador. Exporte a conversa: ' + error.message;
            }
        }

        async function refreshHealth() {
            const status = document.getElementById('connectionStatus');
            try {
                const response = await fetch('/health');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const health = await response.json();
                document.getElementById('modelName').textContent = health.default_model;
                status.textContent = health.ollama_status === 'online'
                    ? 'Ollama conectado · As conversas ficam neste navegador.'
                    : 'Ollama indisponível. Verifique o serviço no servidor.';
            } catch (error) {
                status.textContent = 'API indisponível: ' + error.message;
            }
        }

        function buildHistory(messages, message) {
            const history = [];
            let remaining = 32000 - message.length;
            for (let i = messages.length - 1; i >= 0 && history.length < 20; i--) {
                const content = messages[i].content.slice(-8000);
                if (!content.trim()) continue;
                if (content.length > remaining) break;
                history.unshift({ role: messages[i].role === 'bot' ? 'assistant' : 'user', content });
                remaining -= content.length;
            }
            return history;
        }

        function exportChat() {
            const conv = getActiveConv();
            if (!conv) return;
            const markdown = '# ' + conv.title + '\n\n' + conv.messages.map(m =>
                '## ' + (m.role === 'user' ? 'Você' : 'Menor') + '\n\n' + m.content
            ).join('\n\n');
            const url = URL.createObjectURL(new Blob([markdown], { type: 'text/markdown;charset=utf-8' }));
            const link = document.createElement('a');
            link.href = url;
            link.download = 'menor-' + conv.id + '.md';
            link.click();
            URL.revokeObjectURL(url);
        }

        function newChat() {
            if (isGenerating) return;
            activeConvId = null;
            showWelcome();
            renderConvList();
        }

        function createConversation(firstMsg) {
            const conv = {
                id: genId(),
                title: firstMsg.slice(0, 50) + (firstMsg.length > 50 ? '...' : ''),
                messages: [],
                createdAt: Date.now(),
            };
            conversations.unshift(conv);
            activeConvId = conv.id;
            save();
            renderConvList();
            return conv;
        }

        function getActiveConv() { return conversations.find(c => c.id === activeConvId); }

        function openConv(id) {
            if (isGenerating) return;
            activeConvId = id;
            const conv = getActiveConv();
            if (!conv) return;
            renderConvList();
            showMessages();
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            conv.messages.forEach(m => appendMessage(m.role, m.content, false));
            scrollToBottom();
        }

        function deleteConv(id, e) {
            e.stopPropagation();
            if (isGenerating) return;
            conversations = conversations.filter(c => c.id !== id);
            save();
            if (activeConvId === id) { activeConvId = null; showWelcome(); }
            renderConvList();
        }

        function renderConvList() {
            const list = document.getElementById('convList');
            let html = '<div class="sidebar-section-title">Conversas Recentes</div>';
            conversations.forEach(c => {
                const active = c.id === activeConvId ? 'active' : '';
                html += `
                    <div class="conv-item ${active}">
                        <button class="conv-title" onclick="openConv('${c.id}')">${escHtml(c.title)}</button>
                        <button class="conv-delete" aria-label="Excluir conversa" onclick="deleteConv('${c.id}', event)">✕</button>
                    </div>`;
            });
            if (conversations.length === 0) {
                html += '<div style="padding:16px 12px;color:var(--text-muted);font-size:0.85rem;">Nenhuma conversa ainda.</div>';
            }
            list.innerHTML = html;
        }

        // ========== UI HELPERS ==========
        function showWelcome() {
            if (window.matchMedia('(max-width: 768px)').matches) {
                document.getElementById('sidebar').classList.add('hidden');
            }
            document.getElementById('welcomeScreen').style.display = 'flex';
            document.getElementById('messagesContainer').style.display = 'none';
            document.getElementById('topbarTitle').textContent = 'Menor';
        }

        function showMessages() {
            if (window.matchMedia('(max-width: 768px)').matches) {
                document.getElementById('sidebar').classList.add('hidden');
            }
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('messagesContainer').style.display = 'flex';
            const conv = getActiveConv();
            if (conv) document.getElementById('topbarTitle').textContent = conv.title;
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('hidden'); }

        function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        function scrollToBottom() {
            const area = document.getElementById('chatArea');
            area.scrollTop = area.scrollHeight;
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 150) + 'px';
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!isGenerating) sendMsg(); }
        }

        function appendMessage(role, text, animate = false) {
            const container = document.getElementById('messagesContainer');
            const row = document.createElement('div');
            row.className = `message-row ${role}`;

            const avatarClass = role === 'user' ? 'user-avatar' : 'bot-avatar';
            const avatarText = role === 'user' ? 'I' : 'M';

            const content = document.createElement('div');
            content.className = 'message-content' + (animate ? ' cursor' : '');
            content.textContent = text;

            row.innerHTML = `<div class="avatar ${avatarClass}">${avatarText}</div>`;
            row.appendChild(content);
            container.appendChild(row);
            scrollToBottom();
            return content;
        }

        function useSuggestion(el) {
            document.getElementById('userInput').value = el.textContent;
            sendMsg();
        }

        // ========== SEND MESSAGE ==========
        async function sendMsg() {
            if (isGenerating) return;
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg || msg.length > 8000) return;

            isGenerating = true;
            document.getElementById('sendBtn').disabled = true;
            input.value = '';
            input.style.height = 'auto';

            // Create conversation if needed
            if (!activeConvId) { createConversation(msg); }
            showMessages();
            document.getElementById('messagesContainer').replaceChildren();
            getActiveConv().messages.forEach(m => appendMessage(m.role, m.content));

            const conv = getActiveConv();
            const history = buildHistory(conv.messages, msg);
            conv.messages.push({ role: 'user', content: msg });
            save();

            appendMessage('user', msg);
            const botContent = appendMessage('bot', '', true);

            try {
                const response = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, history })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(typeof error.detail === 'string'
                        ? error.detail : 'Mensagem inválida ou contexto muito grande (HTTP ' + response.status + ').');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let fullReply = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    fullReply += chunk;
                    botContent.textContent = fullReply;
                    scrollToBottom();
                }

                fullReply += decoder.decode();
                botContent.textContent = fullReply;
                if (!fullReply.trim()) throw new Error('O modelo retornou uma resposta vazia.');
                conv.messages.push({ role: 'bot', content: fullReply });
                save();
            } catch (err) {
                botContent.textContent = 'Erro ao se comunicar com o Menor: ' + err.message;
            } finally {
                botContent.classList.remove('cursor');
                isGenerating = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
                scrollToBottom();
            }
        }
    </script>
</body>
</html>

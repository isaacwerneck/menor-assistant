name: Validar Menor

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt flake8
      - run: python -m flake8 src tests --max-line-length=119
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_ui.js
      - run: bash -n scripts/deploy.sh scripts/install-services.sh tests/test_deploy.sh
      - run: bash tests/test_deploy.sh

name: Validar análise de arquivos

on:
  push:
    branches: [main, 'feat/file-analysis-pipeline-chat-b-v1']
    paths:
      - 'src/tools/file_analysis/**'
      - 'tests/test_file_analysis.py'
      - 'requirements-file-analysis.txt'
      - '.github/workflows/file-analysis.yml'
  pull_request:
    paths:
      - 'src/tools/file_analysis/**'
      - 'tests/test_file_analysis.py'
      - 'requirements-file-analysis.txt'
      - '.github/workflows/file-analysis.yml'

permissions:
  contents: read

jobs:
  extractors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install isolated parser dependencies
        run: |
          python -m pip install -r requirements-file-analysis.txt pillow flake8 reportlab
      - name: Lint parser boundary
        run: python -m flake8 src/tools/file_analysis tests/test_file_analysis.py --max-line-length=119
      - name: Run real file extraction and isolation tests
        run: python -m unittest discover -s tests -p 'test_file_analysis.py' -v

name: Validar análise de arquivos

on:
  push:
    branches: [main, 'feat/file-analysis-pipeline-chat-b-v1']
    paths:
      - 'src/tools/file_analysis/**'
      - 'tests/test_file_analysis.py'
      - 'tests/test_file_api.py'
      - 'tests/test_file_ocr.py'
      - 'src/api/main.py'
      - 'requirements-file-analysis.txt'
      - '.github/workflows/file-analysis.yml'
  pull_request:
    paths:
      - 'src/tools/file_analysis/**'
      - 'tests/test_file_analysis.py'
      - 'requirements-file-analysis.txt'
      - '.github/workflows/file-analysis.yml'

permissions:
  contents: read

jobs:
  extractors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install isolated parser dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-file-analysis.txt flake8 reportlab
      - name: Lint parser boundary
        run: python -m flake8 src/tools/file_analysis tests/test_file_analysis.py tests/test_file_api.py tests/test_file_ocr.py --max-line-length=119
      - name: Run real file extraction and isolation tests
        run: python -m unittest discover -s tests -p 'test_file*.py' -v


  ocr-real:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated OCR CI runner only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-por
          python -m pip install -r requirements.txt -r requirements-file-analysis.txt reportlab
      - name: Verify scanned PDF with Tesseract and Poppler
        env:
          MENOR_OCR_E2E: '1'
        run: python -m unittest discover -s tests -p 'test_file_ocr.py' -v
